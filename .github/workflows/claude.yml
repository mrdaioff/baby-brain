name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This job runs with contents/PR/issues write access, so it must not fire
    # for arbitrary outside contributors.
    #
    # Gate on author_association, NOT on `github.actor == github.repository_owner`.
    # On an org-owned repo `repository_owner` is the org name while `actor` is a
    # username, so they can never be equal and the entire ingestion chain
    # silently never runs — issues get created, nothing ever answers them, and
    # nothing in any log says why.
    #
    # OWNER covers a personal repo; MEMBER and COLLABORATOR cover an org repo
    # and any invited collaborator. Everyone else is ignored.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Tool allowlist. The gh/git entries are what the ingestion flow needs;
          # sync-agent-skills lets the agent regenerate the .claude/skills/ mirror
          # after editing a canonical skill. The list is additive — file editing
          # still works without being named here. Add a WebFetch(domain:...) entry
          # only for a domain you actually want the cloud agent reaching.
          claude_args: '--allowedTools "Bash(gh pr *),Bash(gh issue *),Bash(git *),Bash(node scripts/sync-agent-skills.mjs)"'

      - name: Auto-create PR from Claude's branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          set -euo pipefail

          # Find the branch Claude pushed (convention: claude/issue-{number}-*)
          ISSUE_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "No issue/PR number found — skipping."
            exit 0
          fi

          # Find the branch via API — more reliable than git ls-remote which
          # depends on checkout credentials and can silently return empty.
          #
          # IMPORTANT: `gh api --paginate --jq FILTER` runs FILTER once PER
          # PAGE, not once over the combined result set. This repo has 200+
          # branches (multiple pages), so a filter shaped like
          # `[.[] | select(...) | .name] | last` used to emit "null" for
          # every page without a match, plus the real name on the page that
          # had it — gh concatenates those into one newline-joined string.
          # That embedded newline then corrupted `--head "$BRANCH"` in the
          # `gh pr create` call below, producing garbled "No commits between
          # main and <blank>\n<branch>" errors even though the branch and PR
          # were both fine. Fix: keep the jq filter page-safe (plain
          # `.[].name`, which only ever emits real names, never "null") and
          # do the prefix-match + "last" selection in the shell instead.
          BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}/branches" \
            --paginate \
            --jq '.[].name' \
            2>/dev/null | grep "^claude/issue-${ISSUE_NUMBER}-" | sort | tail -n1 || echo "")

          if [ -z "$BRANCH" ]; then
            echo "No Claude branch found for issue #${ISSUE_NUMBER} — skipping."
            exit 0
          fi

          echo "Found branch: $BRANCH"

          # Skip if the branch has no commits ahead of main — this happens
          # when Claude's own turn already opened and merged the PR before
          # this fallback ran. Checking directly via the compare API (ahead_by)
          # avoids relying on `gh pr create` to fail with a parseable error.
          AHEAD_BY=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${BRANCH}" --jq '.ahead_by' 2>/dev/null || echo "")
          if [ "$AHEAD_BY" = "0" ]; then
            echo "No commits between main and $BRANCH — already merged, skipping."
            exit 0
          fi

          # Check if a PR already exists for this branch (any state — Claude's
          # own turn usually already opened and merged one by the time this
          # fallback runs). Use the REST pulls endpoint (strongly consistent,
          # keyed by head ref) instead of `gh pr list`, which searches an
          # eventually-consistent index that can lag right after the PR is
          # created — that miss previously caused a duplicate `gh pr create`
          # against an already-merged branch, failing with "No commits between
          # main and <branch>" and turning a successful run red.
          EXISTING_PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=all&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&per_page=1" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #${EXISTING_PR} already exists for $BRANCH — skipping."
            exit 0
          fi

          # Derive PR title from branch or issue title
          ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title' 2>/dev/null || echo "")

          # Create the PR
          PR_TITLE=""
          PR_BODY="Fixes #${ISSUE_NUMBER}"

          # Use issue title patterns to derive a good PR title
          if echo "$ISSUE_TITLE" | grep -qi "\[Ingest\]"; then
            PR_TITLE=$(echo "$ISSUE_TITLE" | sed 's/\[Ingest\] /ingest: /')
          elif echo "$ISSUE_TITLE" | grep -qi "\[Project Router\]"; then
            # Extract artifact name and use it
            ARTIFACT_NAME=$(echo "$ISSUE_TITLE" | sed 's/\[Project Router\] Route: //')
            PR_TITLE="router: link ${ARTIFACT_NAME}"
          else
            PR_TITLE="claude: ${ISSUE_TITLE}"
          fi

          echo "Creating PR: $PR_TITLE"
          gh pr create \
            --head "$BRANCH" \
            --base main \
            --title "$PR_TITLE" \
            --body "$PR_BODY"

          echo "PR created successfully."
