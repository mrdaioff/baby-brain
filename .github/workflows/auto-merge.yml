name: Auto-merge Ingestion PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ─── Job 1: triggered on PR open / update — queue the auto-merge ───────────
  check-and-merge:
    # Don't run this job for the 'closed' event; that's handled by close-linked-issues
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # Serialize runs per-PR: an 'opened' event and a near-simultaneous
    # 'synchronize' event used to race to merge the same PR, and the loser
    # would hit `gh pr merge` on an already-merged PR and fail loudly (exit 1)
    # even though the PR still merged fine via the winner. Queuing instead of
    # canceling means the second run still executes the "already merged?"
    # guard below and exits clean instead of failing.
    concurrency:
      group: auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Check for Ingestion Context
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Match ONLY on a linked issue carrying an automation label.
          #
          # There used to be a title shortcut here: any PR whose title contained
          # "ingest", "ingestion" or "router" was merged without review. That is
          # far too broad — it squash-merged a hand-written PR modifying this
          # very workflow file, unreviewed, seconds after it opened. A title is
          # author-controlled prose; the label is applied by the automation that
          # actually created the work, so it is the only trustworthy signal.
          #
          # Both producers are covered:
          #   ingest-content.yml  -> label 'ingestion'
          #   project-router.sh   -> label 'project-routing'
          # A PR with no linked labelled issue is a human PR. Leave it alone.
          #
          # GH_REPO is set so gh CLI doesn't need git context.
          linked_issues=$(gh pr view "$PR_URL" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number' || true)

          if [ -z "$linked_issues" ]; then
            echo "No linked closing issues — treating as a human PR."
            echo "match=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          for issue_num in $linked_issues; do
            labels=$(gh issue view "$issue_num" --json labels --jq '.labels[].name' || true)
            if echo "$labels" | grep -qxE 'ingestion|project-routing'; then
              echo "Issue #$issue_num carries an automation label — auto-merging."
              echo "match=true" >> $GITHUB_OUTPUT
              echo "reason=linked_issue" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "match=false" >> $GITHUB_OUTPUT

      # Every automation PR (ingestion and router alike) rewrites the same
      # aggregate files — projects/<slug>/context.md, calls.md, open-items.md
      # and the generated projects/OPEN-ITEMS.md. Two PRs opened minutes apart
      # therefore conflict as soon as the first one merges, `gh pr merge` fails
      # with "Pull Request has merge conflicts", and the work sits stranded on
      # its branch with the issue still open and the file still in inbox/.
      # Nothing flags it: the stale-PR sweep looks at age, not mergeability.
      #
      # This checkout plus the sync loop in the merge step resolve that class
      # of conflict mechanically before merging:
      #   - projects/**/*.md are append-style logs, so a *union* merge (keep
      #     both sides) is the right resolution — nothing is lost; at worst a
      #     section lands twice and the next editor tidies it.
      #   - projects/OPEN-ITEMS.md is generated by scripts/rollup-open-items.mjs
      #     from the per-project open-items files, so it is never hand-resolved:
      #     take either side and regenerate.
      #   - Anything else that conflicts is a real conflict and fails the job.
      #
      # The branch push uses the default GITHUB_TOKEN on purpose: pushes made
      # with it do not fire pull_request `synchronize`, so syncing the branch
      # costs no extra workflow run. The merge itself still uses the PAT so the
      # push to main fires downstream workflows (project-router.yml).
      - name: Checkout PR branch
        if: steps.check.outputs.match == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Sync with base and Merge
        if: steps.check.outputs.match == 'true'
        env:
          # Must use GH_PERSONAL_TOKEN (PAT) — not GITHUB_TOKEN — so the
          # resulting push to main is treated as a real user event and triggers
          # downstream workflows (project-router.yml, etc.). GITHUB_TOKEN-
          # triggered pushes are suppressed by GitHub and never fire other workflows.
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Merging because: ${{ steps.check.outputs.reason }}"

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Runner-local merge drivers (see the comment on the checkout step).
          # .git/info/attributes never leaves the runner, so this cannot change
          # how anyone else's git resolves these files.
          {
            echo 'projects/**/*.md merge=union'
            echo 'projects/OPEN-ITEMS.md -merge'
          } >> .git/info/attributes

          sync_branch_with_base() {
            git fetch --quiet origin "$BASE_REF"
            if git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
              echo "Branch already contains $BASE_REF — nothing to sync."
              return 0
            fi
            if ! git merge --no-edit "origin/$BASE_REF"; then
              unresolved=""
              for f in $(git diff --name-only --diff-filter=U); do
                if [ "$f" = "projects/OPEN-ITEMS.md" ]; then
                  git checkout --theirs -- "$f"
                  git add -- "$f"
                else
                  unresolved="$unresolved $f"
                fi
              done
              if [ -n "$unresolved" ]; then
                echo "::error::Conflicts outside the auto-resolvable set:$unresolved"
                git merge --abort
                return 1
              fi
              git commit --no-edit --quiet
            fi
            # The rollup is derived data — regenerate it from the merged
            # per-project files rather than trusting either side's copy.
            if [ -f scripts/rollup-open-items.mjs ]; then
              node scripts/rollup-open-items.mjs
              if ! git diff --quiet -- projects/OPEN-ITEMS.md; then
                git add projects/OPEN-ITEMS.md
                git commit --quiet -m "chore: regenerate projects/OPEN-ITEMS.md after syncing with $BASE_REF"
              fi
            fi
            # The checkout step configured the default GITHUB_TOKEN for this
            # remote, so this push fires no synchronize event and no extra run.
            git push origin "HEAD:$HEAD_REF"
          }

          for attempt in 1 2 3; do
            # Skip if a concurrent/earlier run already merged (or closed) this
            # PR — makes the loop idempotent under the concurrency queue above,
            # instead of failing on `gh pr merge` of an already-merged PR.
            # `merged` is not a valid `gh pr view --json` field (only `state`,
            # `mergedAt`, `mergeCommit` are) — using it here made this check
            # itself fail with "Unknown JSON field: merged", killing every
            # ingestion PR's auto-merge outright.
            pr_state=$(gh pr view "$PR_URL" --json state --jq '.state')
            if [ "$pr_state" != "OPEN" ]; then
              echo "PR is already $pr_state — skipping merge."
              exit 0
            fi

            sync_branch_with_base || exit 1

            # No `gh pr review --approve` here: the PAT owner is always the PR
            # author (the cloud agent pushes under that identity), so self-approval
            # errors with "Can not approve your own pull request".
            #
            # This is a direct squash merge, not `--auto`, because `--auto` only
            # works when branch protection is enabled. If you DO turn on branch
            # protection with required reviews, this step will start failing — an
            # unapprovable PR cannot be merged by its own author. Either exempt
            # this workflow, or switch to `--auto` and let the queue handle it.
            #
            # Squash merging must also be enabled in the repo's settings.
            if gh pr merge --squash "$PR_URL"; then
              exit 0
            fi
            # Most likely another automation PR merged into main between our
            # sync and our merge, or GitHub has not recomputed mergeability yet.
            echo "Merge attempt $attempt failed — re-syncing and retrying."
            sleep 15
          done
          echo "::error::Could not merge after 3 attempts."
          exit 1

      - name: Close Linked Ingestion Issues
        if: steps.check.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # gh pr merge triggers a closed event but GITHUB_TOKEN-triggered events
          # don't spawn new workflow runs, so Job 2 never fires. Close issues here
          # instead by parsing Fixes/Closes keywords directly from the PR body.
          pr_body=$(gh pr view "$PR_URL" --json body --jq '.body')
          # `|| true` is load-bearing: grep exits 1 when it matches nothing, and
          # this step runs under `bash -e`, so without it the assignment kills
          # the step and the empty-check below is never reached. That turned any
          # PR without a Fixes/Closes reference into a red run.
          issue_nums=$(echo "$pr_body" | grep -ioP '(?:fix(?:es)?|close[sd]?|resolve[sd]?)\s+#\K\d+' || true)

          if [ -z "$issue_nums" ]; then
            echo "No Fixes/Closes references found in PR body"
            exit 0
          fi

          for issue_num in $issue_nums; do
            state=$(gh issue view "$issue_num" --json state --jq '.state')
            if echo "$state" | grep -qi "open"; then
              echo "Closing issue #$issue_num"
              gh issue close "$issue_num" \
                --comment "Auto-closed: PR #${PR_NUMBER} was successfully merged."
            else
              echo "Issue #$issue_num already closed, skipping"
            fi
          done

  # ─── Job 2: triggered ONLY after the PR is actually merged ──────────────────
  close-linked-issues:
    # Run on all close events; merge status is verified via API with retry logic
    # to handle race conditions where github.event.pull_request.merged may not be set
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Merge Status
        id: verify-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          max_retries=3
          retry_delay=2
          attempt=1
          is_merged="false"

          while [ $attempt -le $max_retries ]; do
            echo "Checking merge status (attempt $attempt/$max_retries)..."

            # Query GitHub API for actual merge status via gh CLI.
            # `merged` is not a valid `--json` field (see Job 1's identical
            # fix above) — this call silently fell back to "null" every time
            # via the `|| echo` below, so this loop always retried out and
            # fell through to `is_merged=false`, silently skipping issue
            # auto-close on every merge. Use `state` (OPEN/CLOSED/MERGED).
            merge_status=$(gh pr view "$PR_URL" --json state --jq '.state' 2>/dev/null || echo "null")

            if [ "$merge_status" = "MERGED" ]; then
              echo "PR is merged (API confirmed)"
              is_merged="true"
              break
            elif [ "$merge_status" = "OPEN" ] || [ "$merge_status" = "CLOSED" ]; then
              echo "PR is not merged (API confirmed)"
              is_merged="false"
              break
            else
              echo "Could not determine merge status, retrying in ${retry_delay}s..."
              sleep $retry_delay
              attempt=$((attempt + 1))
            fi
          done

          echo "is_merged=$is_merged" >> $GITHUB_OUTPUT
          echo "Final merge status: $is_merged"

      - name: Check for Ingestion Context
        if: steps.verify-merge.outputs.is_merged == 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Same rule as Job 1: match only on a linked issue carrying an
          # automation label, never on the PR title (author-controlled prose).
          linked_issues=$(gh pr view "$PR_URL" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
          for issue_num in $linked_issues; do
            if gh issue view "$issue_num" --json labels --jq '.labels[].name' | grep -qxE 'ingestion|project-routing'; then
              echo "match=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "match=false" >> $GITHUB_OUTPUT

      - name: Close Linked Ingestion Issues
        if: steps.verify-merge.outputs.is_merged == 'true' && steps.check.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR #$PR_NUMBER was merged. Closing linked ingestion issues..."

          linked_issues=$(gh pr view "$PR_URL" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')

          if [ -z "$linked_issues" ]; then
            echo "No linked issues found"
            exit 0
          fi

          for issue_num in $linked_issues; do
            # Only close issues that carry an automation label — skip unrelated issues
            if gh issue view "$issue_num" --json labels --jq '.labels[].name' | grep -qxE 'ingestion|project-routing'; then
              echo "Closing issue #$issue_num (automation label confirmed)"
              gh issue close "$issue_num" \
                --comment "Auto-closed: PR #${PR_NUMBER} was successfully merged."
            else
              echo "Skipping issue #$issue_num (no automation label)"
            fi
          done
